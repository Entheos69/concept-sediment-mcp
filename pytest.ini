[pytest]
# Blindaje SOL return-vs-assert (2026-09-19): un test que retorna en vez de afirmar
# no comprueba nada y pytest lo da verde igual. Este filtro convierte ESE warning
# --y solo ese-- en error, para que el patron entre en rojo apenas reaparezca.
# No toca los demas warnings.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
